<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset align="center">
        <legend>biodata</legend>
        <form action="#" name="bhoomi" target="_blank" method="post">
        <label for="name">NAME:</label>
        <input type="text" name="name" id="name" placeholder="enter your name.">
            <br><br>
        <label for="pass">PASSWORD:</label>
        <input type="password" name="pass" id="pass">
        <br><br>
        <label for="tel"> PHONE:</label>
        <input type="tel" name="tel" id="tel">
        <br><br>
        <label for="email">MAIL:</label>
        <input type="email" name="email" id="email" placeholder="enter your email">
        <br><br>
        <label for="DOB">AGE:</label>
        <input type="date" name="DOB" id="DOB">
        <br><br>
        <label for="add">ADDRESS:</label>
        <textarea name="add" id="add"></textarea>
        <br><br>
        <label for="gender">GENDER:</label>
        <input type="radio" name="gender" id="gender">
        <label for="gender">MALE</label>
        <input type="radio" name="gender" id="gender">
        <label for="gender">FEMALE</label>
        <br><br>
        <label for="hobb">HOBBIES:</label>
        <input type="checkbox" name="hobb1" id="hobb1">
        <label for="hobb1">PAINTING</label>
        <input type="checkbox" name="hobb2" id="hobb2">
        <label for="hobb2">FOOTBALL</label>
        <br><br>
        <label for="lang">SELECT ANY ONE PROGRAMMING LANGUAGE</label>
        <select name="lang" id="lang">
            <option value="select"></option>
            <option value="C">C</option>
            <option value="C++">C++</option>
            <option value="Python">PYTHON</option>
            <option value="Java">JAVA</option>
        </select>
        </form>
    </fieldset>
</body>
</html>
