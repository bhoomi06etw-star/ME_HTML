<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>basic structure page</title>
</head>
<body>
    <!--block level elements-->
    <div>this is div(block)</div>
    <p>this is paragraph(block)</p>
    <h1>this is heading(block)</h1>
    <section style="border:1px solid orange">a section is also block level
    </section>
    <!--inline elements-->
    <span>this is span(inline)</span>
    <strong>this is strong(inline)</strong>
    <a href="#">this is link(inline)</a>
    <em>this is emphasized text(inline)</em>
</body>
</html>
